<!--
CLAUDE UI NOTE
Use target="_top" so Apps Script does not nest the next web-app page inside the current iframe.
Dynamic getScriptUrl ensures navigation stays on the canonical exec endpoint.
-->
<header class="app-header">
  <a class="brand nav-link" target="_top" data-route="Index" href="<?= getScriptUrl() ?>?page=Index">
    <span class="brand-mark">M</span><span>Mastar Takip</span>
  </a>
  <nav>
    <a class="button button-secondary nav-link" target="_top" data-route="Index" href="<?= getScriptUrl() ?>?page=Index">Hızlı işlem</a>
    <a class="button button-secondary nav-link" target="_top" data-route="MasterTakip" href="<?= getScriptUrl() ?>?page=MasterTakip">Liste</a>
    <a class="button button-secondary nav-link" target="_top" data-route="Sertifikalar" href="<?= getScriptUrl() ?>?page=Sertifikalar">Kalibrasyon Giriş</a>
    <a class="button button-secondary nav-link" target="_top" data-route="Raporlar" href="<?= getScriptUrl() ?>?page=Raporlar">İstatistik</a>
  </nav>
  <div class="user-area">
    <span id="headerUserName" class="user-name"></span>
    <span id="headerUserRole"></span>
  </div>
</header>
<script>
(function(){
  document.addEventListener('DOMContentLoaded', function(){
    var context = window.APP_CONTEXT || {};
    var name = document.getElementById('headerUserName');
    var role = document.getElementById('headerUserRole');
    if (name) name.textContent = context.name || 'Kullanıcı';
    if (role) role.textContent = context.role && context.role !== 'guest' ? '(' + context.role + ')' : '';
  });

  Array.prototype.forEach.call(document.querySelectorAll('.nav-link'), function(link){
    link.addEventListener('click', function(){
      link.classList.add('is-loading');
      link.setAttribute('aria-busy','true');
    });
  });
}());
</script>
