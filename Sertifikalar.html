<script>window.APP_CONTEXT=<?= userContext ?>;</script><script>
/* CLAUDE CALIBRATION NOTE: required reason and standard create a pending quality acceptance; do not call saveCertificate directly for this screen. */
(function(){var $=function(id){return document.getElementById(id);};function message(t,c){$('message').textContent=t;$('message').className='form-message '+c;}function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function find(){var q=$('query').value.trim();if(!q)return message('Ürün kodu veya adı girin.','error');$('find').disabled=true;google.script.run.withSuccessHandler(render).withFailureHandler(function(e){$('find').disabled=false;message(e.message,'error');}).searchProducts(q,{includeAll:true});}function render(rows){$('find').disabled=false;rows=rows||[];$('matches').innerHTML=rows.length?rows.map(function(p,i){return '<button type="button" class="result-card" data-index="'+i+'"><span class="code">'+safe(p.MastarNo)+'</span><strong>'+safe(p.UrunAdi)+'</strong><small>'+safe(p.SeriNo)+' · '+safe(p.AnaKonum||'Depo')+'</small></button>';}).join(''):'<p class="muted">Ürün bulunamadı.</p>';Array.prototype.forEach.call(document.querySelectorAll('#matches [data-index]'),function(b){b.onclick=function(){var p=rows[Number(b.dataset.index)];$('formPanel').hidden=false;$('mastarNo').value=p.MastarNo||'';$('assignedTo').value=(window.APP_CONTEXT||{}).name||'';$('selected').innerHTML='<div class="info-box"><strong>'+safe(p.UrunAdi)+'</strong><span>'+safe(p.MastarNo)+' · Son kalibrasyon: '+safe(p.SonKontrolTarihi||'Kayıt yok')+'</span></div>';$('formPanel').scrollIntoView({behavior:'smooth',block:'start'});};});}function loadOptions(){google.script.run.withSuccessHandler(function(o){$('acceptanceReason').innerHTML=o.reasons.map(function(x){return '<option>'+safe(x)+'</option>';}).join('');$('standard').innerHTML=o.standards.map(function(x){return '<option>'+safe(x)+'</option>';}).join('');}).withFailureHandler(function(e){message(e.message,'error');}).getAcceptanceOptions();}function save(){var c=window.APP_CONTEXT||{};var payload={mastarNo:$('mastarNo').value,certificateNo:$('certificateNo').value,certificateType:$('certificateType').value,organization:$('organization').value,certificateDate:$('certificateDate').value,validityDate:$('validity').value,fileUrl:$('fileUrl').value,description:$('description').value,assignedTo:$('assignedTo').value||c.name||'',acceptanceReason:$('acceptanceReason').value,standard:$('standard').value,userEmail:c.email||'',userName:c.name||''};$('save').disabled=true;google.script.run.withSuccessHandler(function(r){$('save').disabled=false;message('Kayıt gönderildi. Kalite onayı bekleniyor: '+r.acceptanceId,'success');}).withFailureHandler(function(e){$('save').disabled=false;message(e.message||'Kayıt başarısız.','error');}).saveCalibrationWithAcceptance(payload);} $('find').onclick=find;$('query').onkeydown=function(e){if(e.key==='Enter')find();};$('save').onclick=save;loadOptions();}());
</script></body></html>
