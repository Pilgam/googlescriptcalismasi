<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles'); ?>
</head>
<body>
  <?!= include('Header'); ?>
  <main class="page-shell">
    <div class="page-toolbar">
      <div>
        <p class="eyebrow">KALİBRASYON</p>
        <h1>Kalibrasyon Giriş</h1>
      </div>
    </div>

    <section class="panel">
      <div class="search-line">
        <input id="productQuery" placeholder="Ürün kodu veya ürün adı" autocomplete="off">
        <button class="button button-primary" type="button" onclick="loadProductMatch()">Ürün Seç</button>
      </div>
    </section>

    <section class="panel" id="certificateFormPanel">
      <div id="selectedProductSummary"></div>
      <div class="form-grid" style="margin-top:16px;">
        <label class="field">Mastar No<input id="mastarNo"></label>
        <label class="field">Sertifika No<input id="certificateNo"></label>
        <label class="field">Sertifika Türü<select id="certificateType"><option value="Kalibrasyon">Kalibrasyon</option><option value="Uygunluk">Uygunluk</option><option value="Ayrıcalık">Ayrıcalık</option></select></label>
        <label class="field">Kurum<input id="organization"></label>
        <label class="field">Sertifika Tarihi<input id="certificateDate" type="date"></label>
        <label class="field">Geçerlilik Tarihi<input id="validityDate" type="date"></label>
        <label class="field">Dosya URL<input id="fileUrl"></label>
        <label class="field">Konum<select id="location"><option>Depo</option><option>Kalite</option><option>Bakım</option><option>Atölye</option></select></label>
        <label class="field">Atanacak kişi<input id="assignedTo"></label>
        <label class="field" style="grid-column:1 / -1;">Açıklama<textarea id="description" rows="3"></textarea></label>
      </div>
      <div class="save-row">
        <button class="button button-primary" type="button" onclick="saveCertificateEntry()">Kalibrasyon Kaydet</button>
      </div>
      <p id="certificateMessage" class="form-message"></p>
    </section>
  </main>

  <script>window.APP_CONTEXT = <?= userContext ?>;</script>
  <script>
    function loadProductMatch() {
      const q = document.getElementById('productQuery').value.trim();
      if (!q) {
        document.getElementById('selectedProductSummary').innerHTML = '<p class="muted">Ürün seçmek için arama yapın.</p>';
        return;
      }
      google.script.run.withSuccessHandler((rows) => {
        const result = rows && rows[0];
        if (!result) {
          document.getElementById('selectedProductSummary').innerHTML = '<p class="muted">Ürün bulunamadı.</p>';
          return;
        }
        document.getElementById('mastarNo').value = result.MastarNo;
        document.getElementById('selectedProductSummary').innerHTML = '<div class="info-box"><strong>' + safe(result.UrunAdi) + '</strong><span>' + safe(result.MastarNo) + ' · ' + safe(result.AnaKonum || 'Depo') + ' / ' + safe(result.DetayKonum || '-') + '</span></div>';
      }).searchProducts(q, { includeAll: true });
    }

    function saveCertificateEntry() {
      const payload = {
        mastarNo: document.getElementById('mastarNo').value,
        certificateNo: document.getElementById('certificateNo').value,
        certificateType: document.getElementById('certificateType').value,
        organization: document.getElementById('organization').value,
        certificateDate: document.getElementById('certificateDate').value,
        validityDate: document.getElementById('validityDate').value,
        fileUrl: document.getElementById('fileUrl').value,
        description: document.getElementById('description').value,
        assignedTo: document.getElementById('assignedTo').value,
        userEmail: window.APP_CONTEXT.email,
        userName: window.APP_CONTEXT.name,
        source: 'KalibrasyonGiris'
      };
      google.script.run.withSuccessHandler(() => {
        document.getElementById('certificateMessage').textContent = 'Kalibrasyon kaydı eklendi.';
        document.getElementById('certificateMessage').className = 'form-message success';
      }).withFailureHandler((error) => {
        document.getElementById('certificateMessage').textContent = error.message || 'Kayıt başarısız.';
        document.getElementById('certificateMessage').className = 'form-message error';
      }).saveCertificate(payload);
    }

    function safe(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]; });
    }
  </script>
</body>
</html>
