<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><?!= include('Styles'); ?></head><body>
<?!= include('Header'); ?>
<main class="page-shell"><div class="page-toolbar"><div><p class="eyebrow">KALİBRASYON</p><h1>Kalibrasyon Giriş</h1><p class="muted">Ürün seçin ve yeni kalibrasyon kaydını girin.</p></div></div>
<section class="panel"><div class="search-line"><input id="q" placeholder="Mastar kodu veya ürün adı"><button class="button button-primary" id="find">Ürün bul</button></div><div id="matches"></div></section>
<section class="panel" id="formPanel" hidden><div id="selected"></div><div class="form-grid"><label class="field">Mastar No<input id="no" readonly></label><label class="field">Sertifika No<input id="certNo"></label><label class="field">Tür<select id="type"><option>Kalibrasyon</option><option>Uygunluk</option></select></label><label class="field">Kurum<input id="org"></label><label class="field">Kalibrasyon tarihi<input id="certDate" type="date"></label><label class="field">Geçerlilik tarihi<input id="validity" type="date"></label><label class="field">Konum<select id="location"><option>Depo</option><option>Kalite</option><option>Bakım</option><option>Atölye</option></select></label><label class="field">Atanan kişi<input id="assigned"></label><label class="field" style="grid-column:1/-1">Dosya URL<input id="file"></label><label class="field" style="grid-column:1/-1">Açıklama<textarea id="desc" rows="3"></textarea></label></div><div class="save-row"><button class="button button-primary" id="save">Kaydet</button></div><p id="msg" class="form-message"></p></section>
</main><script>window.APP_CONTEXT=<?= userContext ?>;</script><script>
const $=id=>document.getElementById(id); let found=[]; $('find').onclick=find; $('q').onkeydown=e=>{if(e.key==='Enter')find();}; $('save').onclick=save;
function find(){const q=$('q').value.trim();if(!q)return message('Ürün kodu veya adı girin.','error');google.script.run.withSuccessHandler(render).withFailureHandler(e=>message(e.message,'error')).searchProducts(q,{includeAll:true});}
function render(rows){found=rows||[];$('matches').innerHTML=found.length?found.map((p,i)=>'<button class="result-card" type="button" data-i="'+i+'"><span class="code">'+safe(p.MastarNo)+'</span><strong>'+safe(p.UrunAdi)+'</strong><small>'+safe(p.SeriNo)+' · '+safe(p.AnaKonum||'Depo')+'</small></button>').join(''):'<p class="muted">Ürün bulunamadı.</p>';document.querySelectorAll('#matches [data-i]').forEach(b=>b.onclick=()=>select(found[Number(b.dataset.i)]));}
function select(p){$('formPanel').hidden=false;$('no').value=p.MastarNo||'';$('assigned').value=(window.APP_CONTEXT||{}).name||'';$('selected').innerHTML='<div class="info-box"><strong>'+safe(p.UrunAdi)+'</strong><span>'+safe(p.MastarNo)+' · Son kalibrasyon: '+safe(p.SonKontrolTarihi||'Kayıt yok')+' · Konum: '+safe(p.AnaKonum||'Depo')+'</span></div>';}
function save(){const c=window.APP_CONTEXT||{};const data={mastarNo:$('no').value,certificateNo:$('certNo').value,certificateType:$('type').value,organization:$('org').value,certificateDate:$('certDate').value,validityDate:$('validity').value,fileUrl:$('file').value,description:$('desc').value,assignedTo:$('assigned').value||c.name,userEmail:c.email,userName:c.name,source:'KalibrasyonGiris'};google.script.run.withSuccessHandler(()=>message('Kalibrasyon kaydedildi.','success')).withFailureHandler(e=>message(e.message||'Kayıt başarısız.','error')).saveCertificate(data);}
function message(t,c){$('msg').textContent=t;$('msg').className='form-message '+c;}function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
