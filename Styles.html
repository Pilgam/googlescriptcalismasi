<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#64748b; --primary:#2563eb; --primary-dark:#1d4ed8; --border:#e2e8f0; --soft:#eff6ff; --danger:#b91c1c; --success:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px Arial,sans-serif; }
  a { color:inherit; }
  .app-header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#fff; border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:700; }
  .brand-mark,.module-icon { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; background:var(--primary); color:#fff; font-weight:700; }
  .user-area { display:flex; align-items:center; gap:12px; color:var(--muted); }
  .user-name { color:var(--text); font-weight:700; }
  .page-shell { max-width:1180px; margin:0 auto; padding:32px 22px 60px; }
  .page-intro,.page-toolbar,.section-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  h1 { margin:4px 0 8px; font-size:30px; } h2 { margin:0 0 8px; font-size:20px; } h3 { margin:24px 0 12px; }
  .eyebrow { margin:0; color:var(--primary); font-size:11px; font-weight:700; letter-spacing:.12em; }
  .muted { color:var(--muted); } small { display:block; margin-top:4px; color:var(--muted); font-weight:400; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-top:20px; box-shadow:0 4px 14px rgba(15,23,42,.03); }
  .module-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:28px; }
  .module-card { display:flex; align-items:center; gap:14px; min-height:100px; padding:20px; border:1px solid var(--border); border-radius:14px; background:#fff; text-decoration:none; transition:.15s; }
  .module-card:hover { border-color:var(--primary); transform:translateY(-1px); } .module-card-primary { background:var(--primary); color:#fff; border-color:var(--primary); } .module-card-primary .module-icon { background:#fff; color:var(--primary); }
  .module-card strong,.module-card small { display:block; } .module-card small { margin-top:7px; color:var(--muted); } .module-card-primary small { color:#dbeafe; } .is-disabled { opacity:.6; cursor:not-allowed; }
  .search-grid,.form-grid,.detail-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; } .field { display:flex; flex-direction:column; gap:7px; grid-column:span 3; color:var(--muted); font-size:13px; font-weight:600; } .field-wide { grid-column:span 5; }
  input,select,textarea { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--text); font:inherit; } textarea { resize:vertical; }
  .search-actions { grid-column:span 4; display:flex; align-items:end; gap:8px; } .button { border:0; border-radius:9px; padding:11px 16px; cursor:pointer; font-weight:700; text-decoration:none; display:inline-block; } .button-primary { background:var(--primary); color:#fff; } .button-primary:hover { background:var(--primary-dark); } .button-secondary { background:#fff; color:var(--text); border:1px solid var(--border); }
  .results-table-wrap { overflow-x:auto; } .data-table { width:100%; border-collapse:collapse; } .data-table th,.data-table td { padding:13px 10px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; } .data-table th { color:var(--muted); font-size:12px; } .status-badge { display:inline-block; padding:5px 9px; border-radius:999px; background:var(--soft); color:var(--primary-dark); font-size:12px; font-weight:700; }
  .link-button { border:0; padding:0; background:transparent; color:var(--primary); cursor:pointer; font-weight:700; } .info-list { border:1px solid var(--border); border-radius:10px; padding:10px 14px; } .info-list div { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); } .info-list div:last-child { border:0; } .info-list span { color:var(--muted); }
  .form-message { min-height:18px; margin:10px 0 0; } .form-message.error { color:var(--danger); } .form-message.success { color:var(--success); } .hidden { display:none; }
  @media(max-width:760px) { .app-header { padding:0 16px; } .user-area { display:none; } .page-shell { padding:22px 14px 40px; } .field,.field-wide,.search-actions { grid-column:span 12; } .page-toolbar { align-items:flex-start; } .data-table th,.data-table td { padding:10px 7px; } }
</style>
