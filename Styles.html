<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #182235;
    --muted: #718096;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --border: #e2e8f0;
    --soft: #eff6ff;
    --success: #15803d;
    --danger: #b91c1c;
    --warning: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px Arial, sans-serif; }
  a { color: inherit; }
  .app-header { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; }
  .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: #fff; }
  .user-area { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .user-name { color: var(--text); font-weight: 700; }
  .page-shell { max-width: 1200px; margin: 0 auto; padding: 30px 22px 60px; }
  .hero, .page-toolbar, .section-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .hero h1, h1 { margin: 5px 0 8px; font-size: 30px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .eyebrow { margin: 0; color: var(--primary); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .muted { color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-top: 18px; box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04); }
  .hero-stats, .stat-grid { display: flex; gap: 12px; }
  .hero-stats div, .stat-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; min-width: 140px; }
  .hero-stats strong, .stat-card strong { display: block; font-size: 24px; color: var(--primary); }
  .hero-stats span, .stat-card span { font-size: 12px; color: var(--muted); }
  .search-line { display: flex; align-items: center; gap: 12px; }
  .check-box { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
  input, select, textarea { padding: 12px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--text); font: inherit; }
  input { width: 100%; }
  .button { border: 0; border-radius: 9px; padding: 12px 16px; cursor: pointer; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .button-primary { background: var(--primary); color: #fff; }
  .button-primary:hover { background: var(--primary-dark); }
  .button-secondary { background: #fff; border: 1px solid var(--border); }
  .workspace { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 18px; margin-top: 18px; }
  .sidebar { min-height: 400px; }
  .result-card { width: 100%; text-align: left; display: block; padding: 14px 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .result-card:hover { border-color: var(--primary); background: var(--soft); }
  .result-card strong, .result-card small, .result-card em, .code { display: block; }
  .result-card small { margin-top: 6px; color: var(--muted); }
  .code { color: var(--primary); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .result-card em { margin-top: 10px; display: inline-block; padding: 5px 8px; border-radius: 999px; background: var(--soft); color: var(--primary-dark); font-style: normal; font-size: 11px; }
  .detail-panel { min-height: 420px; }
  .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
  .info-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .info-box span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
  .info-box strong { display: block; }
  .action-bar { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .save-row { margin-top: 12px; }
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th, .data-table td { padding: 12px 9px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .data-table th { font-size: 12px; color: var(--muted); }
  .history-box { margin-top: 24px; }
  .history-box h3 { margin-bottom: 10px; }
  .status-badge { padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--primary-dark); font-weight: 700; font-size: 12px; }
  .form-message { min-height: 18px; }
  .form-message.success { color: var(--success); }
  .form-message.error { color: var(--danger); }
  .bar { height: 8px; background: var(--bg); border-radius: 8px; overflow: hidden; min-width: 120px; }
  .bar i { display: block; height: 100%; border-radius: 8px; background: var(--primary); }
  .hidden { display: none; }
  @media (max-width: 760px) {
    .app-header { padding: 0 14px; }
    .user-area { display: none; }
    .page-shell { padding: 22px 14px; }
    .workspace { grid-template-columns: 1fr; }
    .search-line, .hero, .page-toolbar { flex-direction: column; align-items: stretch; }
    .form-grid, .info-grid { grid-template-columns: 1fr; }
    .stat-grid, .hero-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
