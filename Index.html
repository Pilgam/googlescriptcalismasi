<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles'); ?>
</head>
<body>
  <?!= include('Header'); ?>
  <main class="page-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">MASTAR YÖNETİMİ</p>
        <h1>Hızlı işlem merkezi</h1>
        <p class="muted">Mastarı kodu veya adıyla ara, seç ve al/geri koy/transfer işlemini anında kaydet.</p>
      </div>
      <div class="hero-stats">
        <div>
          <strong id="statProducts">-</strong>
          <span>görünen mastar</span>
        </div>
        <div>
          <strong id="statMovements">-</strong>
          <span>toplam hareket</span>
        </div>
      </div>
    </section>

    <section class="panel quick-search">
      <div class="search-line">
        <input id="globalSearch" placeholder="Mastar adı veya kodu yazın · örn: g8 tampon mastar" autocomplete="off">
        <label class="check-box"><input id="includeAll" type="checkbox"> Pasifler dahil</label>
        <button class="button button-primary" onclick="searchProducts_()">Bul</button>
      </div>
      <p id="searchHint" class="muted">Yazım hatalarını ve yakın kod/isim eşleşmelerini de bulmaya çalışır.</p>
    </section>

    <div class="workspace">
      <aside class="sidebar panel">
        <div class="section-head">
          <h2>Sonuçlar</h2>
          <span id="resultCount" class="muted"></span>
        </div>
        <div id="resultsPane">
          <p class="muted">Arama kutusuna mastar adı veya kodu yazın.</p>
        </div>
      </aside>

      <section id="detailPane" class="detail-panel panel hidden">
        <div id="detailContent"></div>
      </section>
    </div>
  </main>

  <script>window.APP_CONTEXT = <?= userContext ?>;</script>
  <script>
    let selectedProduct = null;
    let searchRows = [];

    document.getElementById('globalSearch').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') searchProducts_();
    });

    function searchProducts_() {
      const query = document.getElementById('globalSearch').value.trim();
      if (!query) {
        document.getElementById('searchHint').textContent = 'Bir mastar adı veya kodu yazın.';
        return;
      }

      google.script.run.withSuccessHandler(function (rows) {
        searchRows = rows || [];
        document.getElementById('resultCount').textContent = rows.length + ' sonuç';
        if (!rows.length) {
          document.getElementById('resultsPane').innerHTML = '<p class="muted">Uygun kayıt bulunamadı. Pasifleri dahil etmeyi deneyin.</p>';
          return;
        }

        document.getElementById('resultsPane').innerHTML = rows.map(function (row, index) {
          return '<button class="result-card" onclick="selectProduct(' + index + ')">' +
            '<span class="code">' + safe(row.MastarNo) + '</span>' +
            '<strong>' + safe(row.UrunAdi) + '</strong>' +
            '<small>' + safe(row.SeriNo) + ' · ' + safe(row.AnaKonum) + ' / ' + safe(row.DetayKonum) + '</small>' +
            '<em>' + safe(row.Durum) + '</em>' +
          '</button>';
        }).join('');
      }).withFailureHandler(function (error) {
        document.getElementById('searchHint').textContent = error.message || 'Arama sırasında hata oluştu.';
      }).searchProducts(query, { includeAll: document.getElementById('includeAll').checked });
    }

    function selectProduct(index) {
      selectedProduct = searchRows[index];
      renderSelectedProduct();
    }

    function renderSelectedProduct() {
      if (!selectedProduct) return;
      const product = selectedProduct;
      document.getElementById('detailPane').classList.remove('hidden');
      document.getElementById('detailContent').innerHTML = '' +
        '<div class="section-head"><div><p class="eyebrow">SEÇİLEN MASTAR</p><h2>' + safe(product.UrunAdi) + '</h2><span class="muted">' + safe(product.MastarNo) + ' · ' + safe(product.SeriNo) + '</span></div><span class="status-badge">' + safe(product.Durum) + '</span></div>' +
        '<div class="info-grid">' +
          '<div class="info-box"><span>Ana Konum</span><strong>' + safe(product.AnaKonum) + '</strong></div>' +
          '<div class="info-box"><span>Detay Konum</span><strong>' + safe(product.DetayKonum) + '</strong></div>' +
          '<div class="info-box"><span>Kimde</span><strong>' + safe(product.SorumluKisi || 'Belirtilmemiş') + '</strong></div>' +
          '<div class="info-box"><span>Açıklama</span><strong>' + safe(product.Aciklama || '-') + '</strong></div>' +
        '</div>' +
        '<div class="action-bar">' +
          '<button class="button button-primary" onclick="setAction(\'Al\')">Üzerime Al</button>' +
          '<button class="button button-secondary" onclick="setAction(\'Geri Koy\')">Geri Koy</button>' +
          '<button class="button button-secondary" onclick="setAction(\'Transfer\')">Transfer</button>' +
        '</div>' +
        '<div id="actionForm"></div>' +
        '<div class="history-box"><h3>Son hareketler</h3><div id="historyList">Yükleniyor...</div></div>';

      setAction('Al');
      loadHistory(product.MastarNo);
    }

    function setAction(type) {
      const form = document.getElementById('actionForm');
      form.innerHTML = '<div class="form-grid">' +
        '<label class="field">İşlem<select id="movementType"><option value="' + type + '">' + type + '</option><option value="Al">Al</option><option value="Geri Koy">Geri Koy</option><option value="Transfer">Transfer</option><option value="Kontrol">Kontrol</option></select></label>' +
        '<label class="field">Yeni ana konum<input id="mainLocation" value="' + safeAttr(selectedProduct.AnaKonum) + '"></label>' +
        '<label class="field">Detay / kimde<input id="detailLocation" value="' + safeAttr(selectedProduct.DetayKonum) + '" placeholder="Kişi, raf, dolap, saha..."></label>' +
        '<label class="field">Neden / açıklama<input id="reason" placeholder="Kullanım amacı veya iade nedeni"></label>' +
      '</div>' +
      '<div class="save-row"><button class="button button-primary" onclick="saveMovement_()">İşlemi kaydet</button></div>' +
      '<p id="actionMessage" class="form-message"></p>';
    }

    function saveMovement_() {
      const payload = {
        mastarNo: selectedProduct.MastarNo,
        movementType: document.getElementById('movementType').value,
        newMainLocation: document.getElementById('mainLocation').value,
        newDetailLocation: document.getElementById('detailLocation').value,
        newStatus: selectedProduct.Durum,
        description: document.getElementById('reason').value,
        userEmail: window.APP_CONTEXT.email,
        userName: window.APP_CONTEXT.name,
        source: 'HizliIslem'
      };

      google.script.run.withSuccessHandler(function () {
        showActionMessage('İşlem kaydedildi.', 'success');
        searchProducts_();
        loadHistory(selectedProduct.MastarNo);
      }).withFailureHandler(function (error) {
        showActionMessage(error.message || 'Kayıt sırasında hata oluştu.', 'error');
      }).saveMovement(payload);
    }

    function loadHistory(productNo) {
      google.script.run.withSuccessHandler(function (rows) {
        const el = document.getElementById('historyList');
        if (!rows.length) {
          el.innerHTML = '<p class="muted">Henüz hareket kaydı yok.</p>';
          return;
        }
        el.innerHTML = '<table class="data-table"><thead><tr><th>Tarih</th><th>İşlem</th><th>Kullanıcı</th><th>Eski → Yeni</th><th>Neden</th></tr></thead><tbody>' + rows.slice(0, 8).map(function (row) {
          return '<tr><td>' + safe(row.TarihSaat) + '</td><td>' + safe(row.HareketTuru) + '</td><td>' + safe(row.KullaniciAdi) + '</td><td>' + safe(row.EskiAnaKonum) + ' → ' + safe(row.YeniAnaKonum) + '</td><td>' + safe(row.Aciklama) + '</td></tr>';
        }).join('') + '</tbody></table>';
      }).getMovementHistory(productNo);
    }

    function showActionMessage(message, type) {
      const el = document.getElementById('actionMessage');
      if (!el) return;
      el.textContent = message;
      el.className = 'form-message ' + type;
    }

    function safe(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
      });
    }

    function safeAttr(value) {
      return safe(value).replace(/\n/g, ' ');
    }
  </script>
</body>
</html>
