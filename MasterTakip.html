<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><?!= include('Styles'); ?></head><body>
<?!= include('Header'); ?>
<main class="page-shell"><div class="page-toolbar"><div><p class="eyebrow">LİSTE</p><h1>Mastar listesi</h1><p class="muted">Tüm aktif ürünler açılışta görünür; satır seçince geçmiş ayrıntıları açılır.</p></div></div>
<section class="panel"><div class="search-line"><input id="listSearch" placeholder="Mastar kodu, ürün adı, seri no veya konum" autocomplete="off"><label class="check-box"><input id="listIncludeAll" type="checkbox"> Pasifler dahil</label></div></section>
<section class="panel"><div id="tableResults"><p class="muted">Ürünler yükleniyor...</p></div></section><section id="detailPanel" class="panel hidden"><div id="detailContent"></div></section></main>
<script>window.APP_CONTEXT=<?= userContext ?>;</script><script>
/* CLAUDE LIST NOTE: empty query loads all active rows; row buttons load one complete detail payload. */
(function(){var rows=[],timer=null,search=document.getElementById('listSearch'),all=document.getElementById('listIncludeAll'),table=document.getElementById('tableResults'),detail=document.getElementById('detailPanel'),content=document.getElementById('detailContent');function load(){table.innerHTML='<p class="muted">Yükleniyor...</p>';google.script.run.withSuccessHandler(render).withFailureHandler(error).searchProducts(search.value.trim(),{includeAll:all.checked});}function schedule(){clearTimeout(timer);timer=setTimeout(load,250);}function render(result){rows=result||[];if(!rows.length){table.innerHTML='<p class="muted">Kayıt bulunamadı.</p>';return;}table.innerHTML='<div class="table-wrap"><table class="data-table"><thead><tr><th>Mastar</th><th>Ürün</th><th>Seri</th><th>Konum</th><th>Son kalibrasyon</th><th>Durum</th><th>Kimde</th></tr></thead><tbody>'+rows.map(function(r,i){return '<tr class="product-row" tabindex="0" data-index="'+i+'"><td>'+safe(r.MastarNo)+'</td><td>'+safe(r.UrunAdi)+'</td><td>'+safe(r.SeriNo)+'</td><td>'+safe(r.AnaKonum||'Depo')+' / '+safe(r.DetayKonum||'-')+'</td><td>'+safe(r.SonKontrolTarihi||'-')+'</td><td>'+safe(r.Durum||'-')+'</td><td>'+safe(r.SorumluKisi||'-')+'</td></tr>';}).join('')+'</tbody></table></div>';Array.prototype.forEach.call(document.querySelectorAll('.product-row'),function(row){var choose=function(){Array.prototype.forEach.call(document.querySelectorAll('.product-row'),function(x){x.classList.remove('selected');});row.classList.add('selected');show(rows[Number(row.dataset.index)].MastarNo);};row.addEventListener('click',choose);row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});});}function show(no){detail.classList.remove('hidden');content.innerHTML='<p class="muted">Geçmiş yükleniyor...</p>';google.script.run.withSuccessHandler(renderDetail).withFailureHandler(error).getProductDetail(no);}function renderDetail(d){if(!d){content.innerHTML='<p class="muted">Ürün bulunamadı.</p>';return;}var p=d.product||{};content.innerHTML='<h2>'+safe(p.UrunAdi)+'</h2><p class="muted">'+safe(p.MastarNo)+' · '+safe(p.AnaKonum||'Depo')+' / '+safe(p.DetayKonum||'-')+' · Kimde: '+safe(p.SorumluKisi||'-')+'</p><h3>Kalibrasyon geçmişi</h3>'+certs(d.certificates||[])+'<h3>Kalite kabul geçmişi</h3>'+accepts(d.acceptances||[])+'<h3>Hareket geçmişi</h3>'+moves(d.history||[]);detail.scrollIntoView({behavior:'smooth',block:'start'});}function certs(a){return tableOrEmpty(a,['Tarih','Tür','No','Geçerlilik','Durum'],function(r){return [r.SertifikaTarihi,r.SertifikaTuru,r.SertifikaNo,r.GecerlilikTarihi,r.SertifikaDurumu];});}function accepts(a){return tableOrEmpty(a,['Kabul ID','Neden','Standart','Talep eden','Durum'],function(r){return [r.KabulId,r.KabulNedeni,r.Standart,r.TalepEden,r.Durum];});}function moves(a){return tableOrEmpty(a,['Tarih','İşlem','Yapan','Eski → Yeni','Açıklama'],function(r){return [r.TarihSaat,r.HareketTuru,r.KullaniciAdi,(r.EskiAnaKonum||'-')+' → '+(r.YeniAnaKonum||'-'),r.Aciklama];});}function tableOrEmpty(a,headers,values){if(!a.length)return '<p class="muted">Kayıt yok.</p>';return '<div class="table-wrap"><table class="data-table"><thead><tr>'+headers.map(function(h){return '<th>'+safe(h)+'</th>';}).join('')+'</tr></thead><tbody>'+a.map(function(r){return '<tr>'+values(r).map(function(v){return '<td>'+safe(v||'-')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}function error(e){table.innerHTML='<p class="form-message error">'+safe(e&&e.message||'Veri yüklenemedi.')+'</p>';}function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}search.addEventListener('input',schedule);all.addEventListener('change',load);window.addEventListener('load',load);}());
</script></body></html>
