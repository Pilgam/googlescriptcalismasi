<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles'); ?>
</head>
<body>
<?!= include('Header'); ?>
<main class="page-shell">
  <div class="page-toolbar">
    <div><p class="eyebrow">LİSTE</p><h1>Mastar listesi</h1><p class="muted">Tüm aktif ürünler açılışta görünür; arama yazdıkça filtrelenir.</p></div>
  </div>
  <section class="panel">
    <div class="search-line">
      <input id="listSearch" placeholder="Mastar kodu, ürün adı, seri no veya konum" autocomplete="off">
      <label class="check-box"><input id="listIncludeAll" type="checkbox"> Pasifler dahil</label>
    </div>
  </section>
  <section class="panel"><div id="tableResults"><p class="muted">Ürünler yükleniyor...</p></div></section>
  <section id="detailPanel" class="panel hidden"><div id="detailContent"></div></section>
</main>
<script>window.APP_CONTEXT = <?= userContext ?>;</script>
<script>
/*
  CLAUDE LIST NOTE
  - The first request deliberately sends an empty query: that means all active products.
  - Filtering is client/server debounced to prevent Apps Script calls on every keystroke.
  - Rows are real buttons, not fragile inline onclick strings; clicking one requests
    getProductDetail(), which returns both old certificates and movement history.
*/
(function () {
  var rows = [];
  var timer = null;
  var search = document.getElementById('listSearch');
  var includeAll = document.getElementById('listIncludeAll');
  var table = document.getElementById('tableResults');
  var detail = document.getElementById('detailPanel');
  var detailContent = document.getElementById('detailContent');

  document.addEventListener('DOMContentLoaded', loadProducts);
  search.addEventListener('input', scheduleLoad);
  includeAll.addEventListener('change', loadProducts);

  function scheduleLoad() {
    clearTimeout(timer);
    timer = setTimeout(loadProducts, 250);
  }

  function loadProducts() {
    table.innerHTML = '<p class="muted">Ürünler yükleniyor...</p>';
    google.script.run.withSuccessHandler(renderTable).withFailureHandler(showError)
      .searchProducts(search.value.trim(), { includeAll: includeAll.checked });
  }

  function renderTable(result) {
    rows = result || [];
    if (!rows.length) { table.innerHTML = '<p class="muted">Kayıt bulunamadı.</p>'; return; }
    table.innerHTML = '<div class="table-wrap"><table class="data-table"><thead><tr>' +
      '<th>Mastar</th><th>Ürün</th><th>Seri</th><th>Konum</th><th>Son kalibrasyon</th><th>Durum</th><th>Kimde</th>' +
      '</tr></thead><tbody>' + rows.map(function (row, index) {
        return '<tr class="product-row" tabindex="0" data-index="' + index + '">' +
          '<td>' + safe(row.MastarNo) + '</td><td>' + safe(row.UrunAdi) + '</td>' +
          '<td>' + safe(row.SeriNo) + '</td><td>' + safe(row.AnaKonum || 'Depo') + ' / ' + safe(row.DetayKonum || '-') + '</td>' +
          '<td>' + safe(row.SonKontrolTarihi || '-') + '</td><td>' + safe(row.Durum || '-') + '</td><td>' + safe(row.SorumluKisi || '-') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    Array.prototype.forEach.call(document.querySelectorAll('.product-row'), function (row) {
      row.addEventListener('click', function () { loadDetail(rows[Number(row.dataset.index)].MastarNo); });
      row.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') loadDetail(rows[Number(row.dataset.index)].MastarNo); });
    });
  }

  function loadDetail(productNo) {
    detail.classList.remove('hidden');
    detailContent.innerHTML = '<p class="muted">Ürün geçmişi yükleniyor...</p>';
    google.script.run.withSuccessHandler(renderDetail).withFailureHandler(showError).getProductDetail(productNo);
  }

  function renderDetail(data) {
    if (!data) { detailContent.innerHTML = '<p class="muted">Ürün bulunamadı.</p>'; return; }
    var product = data.product || {};
    detailContent.innerHTML = '<div class="section-head"><div><p class="eyebrow">ÜRÜN DETAYI</p><h2>' + safe(product.UrunAdi) + '</h2><span class="muted">' + safe(product.MastarNo) + '</span></div></div>' +
      '<div class="info-grid"><div class="info-box"><span>Konum</span><strong>' + safe(product.AnaKonum || 'Depo') + ' / ' + safe(product.DetayKonum || '-') + '</strong></div>' +
      '<div class="info-box"><span>Kimde</span><strong>' + safe(product.SorumluKisi || '-') + '</strong></div><div class="info-box"><span>Durum</span><strong>' + safe(product.Durum || '-') + '</strong></div></div>' +
      '<h3>Kalibrasyon geçmişi</h3>' + certificateTable(data.certificates || []) + '<h3 style="margin-top:24px">Hareket geçmişi</h3>' + movementTable(data.history || []);
    detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function certificateTable(items) {
    if (!items.length) return '<p class="muted">Kalibrasyon kaydı yok.</p>';
    return '<div class="table-wrap"><table class="data-table"><thead><tr><th>Tarih</th><th>Tür</th><th>No</th><th>Geçerlilik</th><th>Durum</th></tr></thead><tbody>' + items.map(function (row) {
      return '<tr><td>' + safe(row.SertifikaTarihi || '-') + '</td><td>' + safe(row.SertifikaTuru || '-') + '</td><td>' + safe(row.SertifikaNo || '-') + '</td><td>' + safe(row.GecerlilikTarihi || '-') + '</td><td>' + safe(row.SertifikaDurumu || '-') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function movementTable(items) {
    if (!items.length) return '<p class="muted">Hareket kaydı yok.</p>';
    return '<div class="table-wrap"><table class="data-table"><thead><tr><th>Tarih</th><th>İşlem</th><th>Yapan</th><th>Eski → Yeni</th><th>Açıklama</th></tr></thead><tbody>' + items.map(function (row) {
      return '<tr><td>' + safe(row.TarihSaat || '-') + '</td><td>' + safe(row.HareketTuru || '-') + '</td><td>' + safe(row.KullaniciAdi || '-') + '</td><td>' + safe(row.EskiAnaKonum || '-') + ' → ' + safe(row.YeniAnaKonum || '-') + '</td><td>' + safe(row.Aciklama || '-') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function showError(error) { table.innerHTML = '<p class="form-message error">' + safe(error && error.message || 'Veri yüklenemedi.') + '</p>'; }
  function safe(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
}());
</script>
</body>
</html>
