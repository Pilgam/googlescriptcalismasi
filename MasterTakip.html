<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><?!= include('Styles'); ?></head><body>
<?!= include('Header'); ?>
<main class="page-shell">
  <div class="page-toolbar"><div><p class="eyebrow">LİSTE</p><h1>Mastar listesi</h1><p class="muted">Tüm ürünler açılışta görünür; arama yazdıkça filtrelenir.</p></div></div>
  <section class="panel"><div class="search-line"><input id="q" placeholder="Mastar kodu, isim, seri no veya konum"><label class="check-box"><input id="all" type="checkbox"> Pasifler dahil</label></div></section>
  <section class="panel"><div id="list">Yükleniyor...</div></section>
  <section id="detail" class="panel hidden"><div id="detailBody"></div></section>
</main>
<script>window.APP_CONTEXT=<?= userContext ?>;</script><script>
const $=id=>document.getElementById(id); let products=[];
window.addEventListener('load',load); $('q').addEventListener('input',load); $('all').addEventListener('change',load);
function load(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>{$('list').innerHTML='<p class="form-message error">'+safe(e.message)+'</p>';}).searchProducts($('q').value,{includeAll:$('all').checked});}
function render(rows){products=rows||[];if(!products.length){$('list').innerHTML='<p class="muted">Kayıt bulunamadı.</p>';return;} $('list').innerHTML='<div class="table-wrap"><table class="data-table"><thead><tr><th>Mastar</th><th>Ürün</th><th>Seri</th><th>Konum</th><th>Son kalibrasyon</th><th>Durum</th><th>Kimde</th></tr></thead><tbody>'+products.map((p,i)=>'<tr class="clickable-row" data-i="'+i+'"><td>'+safe(p.MastarNo)+'</td><td>'+safe(p.UrunAdi)+'</td><td>'+safe(p.SeriNo)+'</td><td>'+safe(p.AnaKonum||'Depo')+' / '+safe(p.DetayKonum||'-')+'</td><td>'+safe(p.SonKontrolTarihi||'-')+'</td><td>'+safe(p.Durum||'-')+'</td><td>'+safe(p.SorumluKisi||'-')+'</td></tr>').join('')+'</tbody></table></div>';document.querySelectorAll('.clickable-row').forEach(row=>row.onclick=()=>show(products[Number(row.dataset.i)].MastarNo));}
function show(no){google.script.run.withSuccessHandler(d=>{if(!d)return;const p=d.product;$('detail').classList.remove('hidden');$('detailBody').innerHTML='<h2>'+safe(p.UrunAdi)+'</h2><p class="muted">'+safe(p.MastarNo)+' · '+safe(p.AnaKonum||'Depo')+' / '+safe(p.DetayKonum||'-')+' · Kimde: '+safe(p.SorumluKisi||'-')+'</p><h3>Kalibrasyon geçmişi</h3>'+certs(d.certificates||[])+'<h3 style="margin-top:24px">Hareket geçmişi</h3>'+moves(d.history||[]);$('detail').scrollIntoView({behavior:'smooth'});}).withFailureHandler(e=>alert(e.message||'Detay yüklenemedi.')).getProductDetail(no);}
function certs(a){return a.length?'<div class="table-wrap"><table class="data-table"><tr><th>Tarih</th><th>Tür</th><th>No</th><th>Geçerlilik</th><th>Durum</th></tr>'+a.map(r=>'<tr><td>'+safe(r.SertifikaTarihi||'-')+'</td><td>'+safe(r.SertifikaTuru||'-')+'</td><td>'+safe(r.SertifikaNo||'-')+'</td><td>'+safe(r.GecerlilikTarihi||'-')+'</td><td>'+safe(r.SertifikaDurumu||'-')+'</td></tr>').join('')+'</table></div>':'<p class="muted">Kalibrasyon kaydı yok.</p>';}
function moves(a){return a.length?'<div class="table-wrap"><table class="data-table"><tr><th>Tarih</th><th>İşlem</th><th>Yapan</th><th>Eski → Yeni</th><th>Açıklama</th></tr>'+a.map(r=>'<tr><td>'+safe(r.TarihSaat||'-')+'</td><td>'+safe(r.HareketTuru||'-')+'</td><td>'+safe(r.KullaniciAdi||'-')+'</td><td>'+safe(r.EskiAnaKonum||'-')+' → '+safe(r.YeniAnaKonum||'-')+'</td><td>'+safe(r.Aciklama||'-')+'</td></tr>').join('')+'</table></div>':'<p class="muted">Hareket kaydı yok.</p>';}
function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
