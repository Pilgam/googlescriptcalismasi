<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include('Styles'); ?>
  </head>
  <body>
    <?!= include('Header'); ?>
    <main class="page-shell">
      <div class="page-toolbar"><div><p class="eyebrow">MODÜL / MASTAR TAKİP</p><h1>Mastar Takip</h1></div><a class="button button-secondary" href="?page=Index">Ana Menü</a></div>
      <section class="panel">
        <div class="search-grid">
          <label class="field field-wide">Arama<input id="searchInput" placeholder="Mastar no, ürün adı, seri no veya açıklama"></label>
          <label class="field">Durum<select id="statusFilter"><option value="">Tümü</option></select></label>
          <label class="field">Ana Konum<select id="locationFilter"><option value="">Tümü</option></select></label>
          <div class="search-actions"><button id="searchButton" class="button button-primary">Ara</button><button id="clearButton" class="button button-secondary">Temizle</button></div>
        </div>
        <p id="searchMessage" class="form-message"></p>
      </section>
      <section class="panel"><div class="section-heading"><h2>Sonuçlar</h2><span id="resultCount" class="muted"></span></div><div id="results" class="results-table-wrap"><p class="muted">Arama yapmak için kriter girin.</p></div></section>
      <section id="detailPanel" class="panel hidden"></section>
    </main>
    <script>window.APP_CONTEXT = <?= userContext ?>;</script>
    <script>
      let selectedProduct = null;
      const $ = (id) => document.getElementById(id);
      document.addEventListener('DOMContentLoaded', () => { loadFilters(); $('searchButton').onclick = search; $('clearButton').onclick = clearSearch; $('searchInput').onkeydown = (e) => { if (e.key === 'Enter') search(); }; });
      function loadFilters() { google.script.run.withSuccessHandler((data) => { fillSelect('statusFilter', data.statuses); fillSelect('locationFilter', data.locations); }).getFilterOptions(); }
      function fillSelect(id, values) { values.forEach((value) => { const option = document.createElement('option'); option.value = value; option.textContent = value; $(id).appendChild(option); }); }
      function search() { const filters = { status: $('statusFilter').value, location: $('locationFilter').value }; google.script.run.withSuccessHandler(renderResults).withFailureHandler(showError).searchProducts($('searchInput').value, filters); }
      function clearSearch() { $('searchInput').value = ''; $('statusFilter').value = ''; $('locationFilter').value = ''; $('results').innerHTML = '<p class="muted">Arama yapmak için kriter girin.</p>'; $('detailPanel').classList.add('hidden'); $('resultCount').textContent = ''; }
      function renderResults(products) { $('resultCount').textContent = products.length + ' kayıt'; if (!products.length) { $('results').innerHTML = '<p class="muted">Sonuç bulunamadı.</p>'; return; } $('results').innerHTML = '<table class="data-table"><thead><tr><th>Mastar No</th><th>Ürün Adı</th><th>Seri No</th><th>Konum</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>' + products.map((product) => '<tr><td><strong>' + safe(product.MastarNo) + '</strong></td><td>' + safe(product.UrunAdi) + '</td><td>' + safe(product.SeriNo) + '</td><td>' + safe(product.AnaKonum) + '<small>' + safe(product.DetayKonum) + '</small></td><td><span class="status-badge">' + safe(product.Durum) + '</span></td><td><button class="link-button" onclick="selectProduct(\'' + encodeURIComponent(product.MastarNo) + '\')">Detay</button></td></tr>').join('') + '</tbody></table>'; }
      function selectProduct(encodedNo) { const no = decodeURIComponent(encodedNo); google.script.run.withSuccessHandler((products) => { selectedProduct = products[0]; renderDetail(selectedProduct); }).searchProducts(no, {}); }
      function renderDetail(product) { if (!product) return; $('detailPanel').classList.remove('hidden'); $('detailPanel').innerHTML = '<div class="section-heading"><div><p class="eyebrow">SEÇİLEN KAYIT</p><h2>' + safe(product.UrunAdi) + '</h2><p class="muted">' + safe(product.MastarNo) + '</p></div><span class="status-badge">' + safe(product.Durum) + '</span></div><div class="detail-grid"><div class="info-list"><div><span>Mastar No</span><strong>' + safe(product.MastarNo) + '</strong></div><div><span>Seri No</span><strong>' + safe(product.SeriNo) + '</strong></div><div><span>Açıklama</span><strong>' + safe(product.Aciklama) + '</strong></div><div><span>Sorumlu</span><strong>' + safe(product.SorumluKisi) + '</strong></div></div><div class="info-list"><div><span>Ana Konum</span><strong>' + safe(product.AnaKonum) + '</strong></div><div><span>Detay Konum</span><strong>' + safe(product.DetayKonum) + '</strong></div><div><span>Sonraki Kontrol</span><strong>' + safe(product.SonrakiKontrolTarihi) + '</strong></div><div><span>Kalibrasyon</span><strong>' + safe(product.KalibrasyonDurumu) + '</strong></div></div></div><h3>Yeni Hareket</h3><div class="form-grid"><label class="field">Hareket Türü<select id="movementType"><option>Transfer</option><option>Giriş</option><option>Çıkış</option><option>Kontrol</option><option>Bakım</option></select></label><label class="field">Yeni Ana Konum<input id="newMainLocation" value="' + safeAttr(product.AnaKonum) + '"></label><label class="field">Yeni Detay Konum<input id="newDetailLocation" value="' + safeAttr(product.DetayKonum) + '"></label><label class="field">Yeni Durum<select id="newStatus"><option>' + safe(product.Durum) + '</option><option>Hazır</option><option>Kullanımda</option><option>Bakımda</option><option>Kalibrasyonda</option><option>Pasif</option></select></label></div><label class="field">Açıklama<textarea id="movementDescription" rows="3"></textarea></label><button class="button button-primary" onclick="saveMovement()">Hareketi Kaydet</button><p id="detailMessage" class="form-message"></p><div class="history"><h3>Hareket Geçmişi</h3><div id="historyList"><p class="muted">Yükleniyor...</p></div></div>'; loadHistory(product.MastarNo); }
      function loadHistory(no) { google.script.run.withSuccessHandler((rows) => { if (!rows.length) { $('historyList').innerHTML = '<p class="muted">Henüz hareket kaydı yok.</p>'; return; } $('historyList').innerHTML = '<div class="results-table-wrap"><table class="data-table"><thead><tr><th>Tarih</th><th>Hareket</th><th>Eski Konum</th><th>Yeni Konum</th><th>Kullanıcı</th><th>Açıklama</th></tr></thead><tbody>' + rows.map((row) => '<tr><td>' + safe(row.TarihSaat) + '</td><td>' + safe(row.HareketTuru) + '</td><td>' + safe(row.EskiAnaKonum) + '</td><td>' + safe(row.YeniAnaKonum) + '</td><td>' + safe(row.KullaniciAdi) + '</td><td>' + safe(row.Aciklama) + '</td></tr>').join('') + '</tbody></table></div>'; }).getMovementHistory(no); }
      function saveMovement() { const data = { mastarNo: selectedProduct.MastarNo, movementType: $('movementType').value, newMainLocation: $('newMainLocation').value, newDetailLocation: $('newDetailLocation').value, newStatus: $('newStatus').value, description: $('movementDescription').value, userEmail: window.APP_CONTEXT.email, userName: window.APP_CONTEXT.name, source: 'MastarTakip' }; google.script.run.withSuccessHandler((response) => { selectedProduct = response.product; renderDetail(response.product); showDetailMessage('Hareket kaydedildi.', 'success'); }).withFailureHandler((error) => showDetailMessage(error.message, 'error')).saveMovement(data); }
      function showDetailMessage(message, type) { $('detailMessage').textContent = message; $('detailMessage').className = 'form-message ' + type; }
      function showError(error) { $('searchMessage').textContent = error.message || 'Bir hata oluştu.'; $('searchMessage').className = 'form-message error'; }
      function safe(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
      function safeAttr(value) { return safe(value).replace(/\n/g, ' '); }
    </script>
  </body>
</html>
